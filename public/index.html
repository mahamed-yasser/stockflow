<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockFlow</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b>StockFlow</b><nav id="nav" hidden><button data-v="dash" class="on">Dashboard</button><button data-v="prod">Products</button><button data-v="ord">Orders</button><button data-v="re">Reorder</button><button data-v="imp">Import / export</button></nav><button class="ghost sm" id="out" hidden>Log out</button></header>
<main>
<div id="setup" class="card" style="max-width:420px;margin:30px auto" hidden><h1>Create your account</h1><p class="mut">First run. Choose a username and a password of at least 10 characters. This form only works while no account exists.</p><form id="sf"><label for="su">Username</label><input id="su" autocomplete="username"><label for="sp">Password</label><input id="sp" type="password" autocomplete="new-password"><p id="serr" class="msg err" hidden></p><p><button>Create account</button></p></form></div>
<div id="login" class="card" style="max-width:380px;margin:40px auto" hidden><h1>Log in</h1><form id="lf"><label for="u">Username</label><input id="u" autocomplete="username"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><p id="lerr" class="msg err" hidden></p><p><button>Log in</button></p></form></div>
<p id="amsg" class="msg" hidden></p>
<section id="dash" hidden></section><section id="prod" hidden></section><section id="ord" hidden></section><section id="re" hidden></section><section id="imp" hidden></section>
</main><div id="modal" class="modal" hidden></div>
<script>
const $=id=>document.getElementById(id);let ENV={},P=[],O=[],pf='all',pq='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,body)=>{const o=body===undefined?{}:{method:'POST',body:JSON.stringify(body)};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Error');e.status=r.status;throw e}return d};
const M=c=>new Intl.NumberFormat('en',{style:'currency',currency:ENV.currency||'USD'}).format(c/100);
const note=(t,ok=true)=>{const m=$('amsg');m.className='msg '+(ok?'ok':'err');m.textContent=t;m.hidden=false;clearTimeout(note.t);note.t=setTimeout(()=>m.hidden=true,6000)};
const guard=fn=>async(...a)=>{try{await fn(...a)}catch(x){note(x.message,false)}};
async function boot(){const st=await api('/api/setup-status');['setup','login','dash','prod','ord','re','imp'].forEach(i=>$(i).hidden=true);$('nav').hidden=$('out').hidden=true;
if(st.needsSetup){$('setup').hidden=false;return}
try{ENV=await api('/api/me')}catch{$('login').hidden=false;return}
$('nav').hidden=$('out').hidden=false;await refresh();view(sessionStorage.v||'dash')}
async function refresh(){const [a,b]=await Promise.all([api('/api/products'),api('/api/orders')]);P=a.products;O=b.orders}
function view(v){sessionStorage.v=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));['dash','prod','ord','re','imp'].forEach(s=>$(s).hidden=s!==v);({dash:rDash,prod:rProd,ord:rOrd,re:rRe,imp:rImp})[v]()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)view(b.dataset.v)};
$('sf').onsubmit=async e=>{e.preventDefault();try{await api('/api/setup',{username:$('su').value,password:$('sp').value});boot()}catch(x){$('serr').textContent=x.message;$('serr').hidden=false}};
$('lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{username:$('u').value,password:$('p').value});boot()}catch(x){$('lerr').textContent=x.message;$('lerr').hidden=false}};
$('out').onclick=async()=>{await api('/api/logout',{});boot()};
function modal(html){$('modal').innerHTML='<div>'+html+'</div>';$('modal').hidden=false}
function close_(){$('modal').hidden=true;$('modal').innerHTML=''}
$('modal').onclick=e=>{if(e.target===$('modal'))close_()};
const after=async(msg)=>{await refresh();close_();view(sessionStorage.v);if(msg)note(msg)};
const mErr=x=>{$('dmsg').textContent=x.message;$('dmsg').hidden=false};
async function rDash(){const d=await api('/api/dashboard');const max=Math.max(1,...d.days.map(x=>x.cents));
$('dash').innerHTML=`<h1>Dashboard</h1><div class="stats"><div class="stat"><span>Sales this month</span><b>${M(d.monthRevenue)}</b></div><div class="stat ok"><span>Gross profit this month</span><b>${M(d.monthProfit)}</b></div><div class="stat ${d.lowCount?'bad':''}"><span>Low stock items</span><b>${d.lowCount}</b></div><div class="stat"><span>Stock value (at cost)</span><b>${M(d.stockValue)}</b></div><div class="stat"><span>Open orders</span><b>${d.openOrders}</b></div></div>
<div class="row" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Sales, last 14 days</h2><div class="chart">${d.days.map(x=>`<div class="bar" title="${x.day}: ${M(x.cents)}"><i class="d" style="height:${Math.round(x.cents/max*100)}%"></i><small>${x.day.slice(8)}</small></div>`).join('')}</div></div>
<div class="card"><h2>Reorder soon</h2>${d.low.length?`<table><tbody>${d.low.map(l=>`<tr><td><b>${esc(l.name)}</b><br><span class="mut">${esc(l.sku)}</span></td><td class="n"><span class="pill low">${l.stock} left</span><br><span class="mut">reorder at ${l.reorder}</span></td><td class="n"><button class="sm" data-rc="${l.id}">Receive</button></td></tr>`).join('')}</tbody></table>`:'<p class="mut">Nothing is running low.</p>'}</div></div>
<div class="card"><h2>Top sellers this month</h2>${d.top.length?`<table><thead><tr><th>Product</th><th class="n">Units</th><th class="n">Revenue</th></tr></thead><tbody>${d.top.map(t=>`<tr><td>${esc(t.name)}</td><td class="n">${t.units}</td><td class="n">${M(t.revenue)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">No sales yet this month.</p>'}</div>`;
$('dash').querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>stockDialog(+b.dataset.rc))}
function rProd(){const rows=P.filter(p=>(pf==='all'||(pf==='low'&&p.low)||(pf==='off'&&!p.active))&&(!pq||(p.sku+p.name).toLowerCase().includes(pq.toLowerCase())));
$('prod').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>Products</h1><button id="np">New product</button></div><div class="card"><div class="chips">${[['all','All'],['low','Low stock'],['off','Inactive']].map(([k,l])=>`<button data-f="${k}" class="${pf===k?'on':''}">${l}</button>`).join('')}</div><input id="pq" placeholder="Search name or SKU" value="${esc(pq)}" style="max-width:300px;margin-bottom:10px">
<table class="cards"><thead><tr><th>SKU</th><th>Product</th><th class="n">Price</th><th class="n">Cost</th><th class="n">In stock</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td data-l="SKU">${esc(p.sku)}</td><td><b>${esc(p.name)}</b></td><td class="n" data-l="Price">${M(p.price_cents)}</td><td class="n" data-l="Cost">${M(p.cost_cents)}</td><td class="n" data-l="In stock"><b>${p.stock}</b></td><td>${!p.active?'<span class="pill off">inactive</span>':p.low?'<span class="pill low">low</span>':'<span class="pill ok">ok</span>'}</td><td class="n"><button class="sm" data-s="${p.id}">Stock</button> <button class="sm ghost" data-e="${p.id}">Edit</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<p class="mut">No products match.</p>'}</div>`;
$('prod').querySelector('.chips').onclick=e=>{const b=e.target.closest('button');if(b){pf=b.dataset.f;rProd()}};
$('pq').oninput=e=>{pq=e.target.value;const n=pq.length;rProd();$('pq').focus();$('pq').setSelectionRange(n,n)};
$('np').onclick=()=>prodForm();$('prod').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>prodForm(+b.dataset.e));$('prod').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>stockDialog(+b.dataset.s))}
function prodForm(id){const p=id?P.find(x=>x.id===id):{sku:'',name:'',price_cents:0,cost_cents:0,reorder_level:0,active:1};const f=c=>(c/100).toFixed(2);
modal(`<h1>${id?'Edit product':'New product'}</h1><div class="row"><div><label for="fs">SKU</label><input id="fs" value="${esc(p.sku)}"></div><div><label for="fn">Name</label><input id="fn" value="${esc(p.name)}"></div><div><label for="fp">Price</label><input id="fp" type="number" step="0.01" min="0" value="${f(p.price_cents)}"></div><div><label for="fc">Cost</label><input id="fc" type="number" step="0.01" min="0" value="${f(p.cost_cents)}"></div><div><label for="fr">Reorder at</label><input id="fr" type="number" min="0" value="${p.reorder_level}"></div>${id?`<div><label for="fa">Status</label><select id="fa"><option value="1" ${p.active?'selected':''}>Active</option><option value="0" ${p.active?'':'selected'}>Inactive</option></select></div>`:'<div><label for="fo">Opening stock</label><input id="fo" type="number" min="0" value="0"></div>'}</div><p id="dmsg" class="msg err" hidden></p><div class="actions"><button id="ok">Save</button><button class="ghost" id="x">Cancel</button></div>`);
$('x').onclick=close_;$('ok').onclick=async()=>{try{await api(id?'/api/products/'+id:'/api/products',{sku:$('fs').value,name:$('fn').value,price:$('fp').value,cost:$('fc').value,reorderLevel:$('fr').value,active:id?$('fa').value==='1':undefined,openingStock:id?undefined:$('fo').value});await after('Product saved.')}catch(x){mErr(x)}}}
async function stockDialog(id){const p=P.find(x=>x.id===id);const {movements}=await api(`/api/products/${id}/movements`);
modal(`<h1>${esc(p.name)} <span class="mut">${esc(p.sku)}</span></h1><p>In stock: <b>${p.stock}</b> · reorder at ${p.reorder_level}</p><div class="row"><div class="card"><h2>Receive stock</h2><label for="rq">Quantity received</label><input id="rq" type="number" min="1" value="10"><label for="rn">Note (optional)</label><input id="rn" placeholder="Supplier delivery"><p><button id="rcv">Add to stock</button></p></div><div class="card"><h2>Stock count correction</h2><label for="ac">Counted quantity</label><input id="ac" type="number" min="0" value="${p.stock}"><label for="an">Reason</label><input id="an" placeholder="e.g. damaged, miscount"><p><button class="ghost" id="adj">Set count</button></p></div></div><p id="dmsg" class="msg err" hidden></p>
<h2>Stock history</h2><table><thead><tr><th>Date</th><th class="n">Change</th><th class="n">Balance</th><th>Reason</th><th></th></tr></thead><tbody>${movements.map(m=>`<tr><td>${m.day}</td><td class="n"><b>${m.delta>0?'+':''}${m.delta}</b></td><td class="n">${m.balance}</td><td>${esc(m.reason)}</td><td class="mut">${esc(m.ref||m.note||'')}</td></tr>`).join('')}</tbody></table><div class="actions"><button class="ghost" id="x">Close</button></div>`);
$('x').onclick=close_;$('rcv').onclick=async()=>{try{await api(`/api/products/${id}/receive`,{qty:$('rq').value,note:$('rn').value});await after('Stock received.')}catch(x){mErr(x)}};
$('adj').onclick=async()=>{try{await api(`/api/products/${id}/adjust`,{count:$('ac').value,note:$('an').value});await after('Stock count corrected.')}catch(x){mErr(x)}}}
async function rRe(){const r=await api('/api/reorder');
$('re').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>Reorder list</h1><a class="btn ghost" href="/api/export/reorder.csv">Download CSV</a></div>
<p class="mut">Products at or under their reorder level, or that would run out within 7 days at the pace of the last 30 days. Suggested quantity restores the reorder level plus 14 days of sales. It is a starting point, not a forecast: check it against what you know about the season and your suppliers.</p>
<div class="card">${r.rows.length?`<table class="cards"><thead><tr><th>Product</th><th class="n">In stock</th><th class="n">Sold, 30 days</th><th class="n">Days left</th><th class="n">Order</th><th class="n">Est. cost</th><th>Why</th><th></th></tr></thead><tbody>${r.rows.map(x=>`<tr><td data-l="Product"><b>${esc(x.name)}</b><br><span class="mut">${esc(x.sku)}</span></td><td class="n" data-l="In stock">${x.stock}</td><td class="n" data-l="Sold, 30 days">${x.sold30}</td><td class="n" data-l="Days left">${x.cover_days===null?'no recent sales':x.cover_days}</td><td class="n" data-l="Order"><b>${x.suggested}</b></td><td class="n" data-l="Est. cost">${M(x.est_cost_cents)}</td><td data-l="Why"><span class="pill ${x.stock<=0?'cancelled':'low'}">${esc(x.reason)}</span></td><td class="n"><button class="sm" data-rc="${x.id}">Receive</button></td></tr>`).join('')}</tbody></table><p style="text-align:right"><b>Estimated total at cost: ${M(r.totalCostCents)}</b></p>`:'<p class="mut">Nothing needs ordering right now.</p>'}</div>`;
$('re').querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>stockDialog(+b.dataset.rc))}
function rOrd(){$('ord').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>Orders</h1><button id="no">New order</button></div><div class="card"><table class="cards"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th class="n">Units</th><th class="n">Total</th><th>Status</th></tr></thead><tbody>${O.map(o=>`<tr class="click" data-id="${o.id}"><td data-l="Order"><b>${o.number}</b></td><td data-l="Date">${o.day}</td><td data-l="Customer">${esc(o.customer)}</td><td class="n" data-l="Units">${o.units}</td><td class="n" data-l="Total">${M(o.total)}</td><td><span class="pill ${o.status}">${o.status}</span></td></tr>`).join('')}</tbody></table>${O.length?'':'<p class="mut">No orders yet.</p>'}</div>`;
$('no').onclick=newOrder;$('ord').querySelectorAll('tr.click').forEach(r=>r.onclick=()=>orderDetail(+r.dataset.id))}
function orderDetail(id){const o=O.find(x=>x.id===id);
modal(`<div style="display:flex;justify-content:space-between"><h1>${o.number} <span class="pill ${o.status}">${o.status}</span></h1><button class="ghost sm" id="x" style="height:32px">Close</button></div><p class="mut">${esc(o.customer)} · ${o.day}</p><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Unit</th><th class="n">Amount</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.name)}<br><span class="mut">${esc(i.sku)}</span></td><td class="n">${i.qty}</td><td class="n">${M(i.unit_cents)}</td><td class="n">${M(i.qty*i.unit_cents)}</td></tr>`).join('')}</tbody></table><div class="tot"><div class="g"><span>Total</span><span>${M(o.total)}</span></div></div><p id="dmsg" class="msg err" hidden></p>
<div class="actions"><a class="btn ghost" target="_blank" href="/slip?id=${o.id}">Print packing slip</a>${o.status==='placed'?'<button id="ful">Mark fulfilled</button><button class="danger" id="can">Cancel and return stock</button>':''}</div>`);
$('x').onclick=close_;const st=s=>async()=>{try{await api(`/api/orders/${id}/status`,{status:s});await after(s==='cancelled'?'Order cancelled, stock returned.':'Order fulfilled.')}catch(x){mErr(x)}};
if($('ful'))$('ful').onclick=st('fulfilled');if($('can'))$('can').onclick=()=>{if(confirm('Cancel this order and return its stock?'))st('cancelled')()}}
function newOrder(){const act=P.filter(p=>p.active);
modal(`<h1>New order</h1><label for="oc">Customer</label><input id="oc" placeholder="Customer name"><label>Items</label><div id="pl"></div><button class="ghost sm" id="ai">Add item</button><div class="tot" id="ot"></div><p id="dmsg" class="msg err" hidden></p><div class="actions"><button id="ok">Place order</button><button class="ghost" id="x">Cancel</button></div>`);
const pl=$('pl');const add=()=>{const r=document.createElement('div');r.className='pl';r.innerHTML=`<select class="ps">${act.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock} in stock, ${M(p.price_cents)})</option>`).join('')}</select><input type="number" min="1" value="1" class="pq" aria-label="Quantity"><button class="ghost sm rm" type="button" aria-label="Remove item">x</button>`;pl.appendChild(r);calc()};
function calc(){let t=0;pl.querySelectorAll('.pl').forEach(r=>{const p=P.find(x=>x.id==r.querySelector('.ps').value);t+=p.price_cents*(+r.querySelector('.pq').value||0)});$('ot').innerHTML=`<div class="g"><span>Total</span><span>${M(t)}</span></div>`}
pl.oninput=calc;pl.onclick=e=>{if(e.target.classList.contains('rm')&&pl.children.length>1){e.target.closest('.pl').remove();calc()}};$('ai').onclick=add;add();$('x').onclick=close_;
$('ok').onclick=async()=>{try{const items=[...pl.querySelectorAll('.pl')].map(r=>({productId:r.querySelector('.ps').value,qty:r.querySelector('.pq').value}));const r=await api('/api/orders',{customer:$('oc').value,items});await after('Order '+r.order.number+' placed, stock updated.')}catch(x){mErr(x)}}}
function rImp(){$('imp').innerHTML=`<h1>Import / export</h1><div class="card"><h2>Import products from CSV</h2><p class="mut">Columns: <b>sku, name, price</b> and optionally cost, reorder_level, stock. Existing SKUs are updated, new ones created. If <b>stock</b> is given it sets the count. Nothing is saved if any row has an error.</p><textarea id="csv" class="csv" placeholder="sku,name,price,cost,reorder_level,stock&#10;PEN-1,Gel pen,1.5,0.6,50,200"></textarea><p><input type="file" id="file" accept=".csv,text/csv" style="max-width:300px"></p><p id="dmsg" class="msg" hidden></p><div id="rep"></div><div class="actions"><button class="ghost" id="chk">Check file</button><button id="go" disabled>Import</button></div></div>
<div class="card"><h2>Export</h2><div class="actions"><a class="btn ghost" href="/api/export/products.csv">Products and stock (CSV)</a><a class="btn ghost" href="/api/export/movements.csv">Stock movements (CSV)</a></div></div>`;
$('file').onchange=async e=>{const f=e.target.files[0];if(f){$('csv').value=await f.text();$('go').disabled=true}};$('csv').oninput=()=>$('go').disabled=true;
const run=async dry=>{const r=await api('/api/import',{csv:$('csv').value,dryRun:dry});const m=$('dmsg');
if(r.errors.length){m.className='msg err';m.textContent=`${r.errors.length} problem(s). Nothing was imported.`;m.hidden=false;$('rep').innerHTML=`<table><tbody>${r.errors.map(e=>`<tr><td>Line ${e.line}</td><td>${esc(e.error)}</td></tr>`).join('')}</tbody></table>`;$('go').disabled=true;return}
if(r.committed){m.className='msg ok';m.textContent=`Imported: ${r.created} created, ${r.updated} updated.`;m.hidden=false;$('rep').innerHTML='';$('go').disabled=true;await refresh();return}
m.className='msg ok';m.textContent=`File looks good: ${r.created} new, ${r.updated} to update. Nothing saved yet.`;m.hidden=false;$('go').disabled=false;
$('rep').innerHTML=`<table><thead><tr><th>SKU</th><th>Name</th><th>Action</th><th class="n">Price</th><th class="n">Stock</th></tr></thead><tbody>${r.preview.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${p.action}</td><td class="n">${M(p.price_cents)}</td><td class="n">${p.stock??'unchanged'}</td></tr>`).join('')}</tbody></table>`};
$('chk').onclick=guard(()=>run(true));$('go').onclick=guard(()=>run(false))}
boot();
</script></body></html>
