<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packing slip</title>
<style>body{font:15px/1.5 system-ui,sans-serif;color:#111;max-width:720px;margin:30px auto;padding:0 20px}h1{margin:0}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th.n,td.n{text-align:right}.mut{color:#555}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}h1{font-size:26px}.box{display:inline-block;width:16px;height:16px;border:2px solid #111;vertical-align:middle}.st{display:inline-block;border:2px solid #111;padding:2px 12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}button{padding:8px 16px;margin-bottom:16px}@media print{button{display:none}body{margin:0}}</style><style>
#demo-banner{background:#fff7d6;color:#3b2f00;border-bottom:1px solid #e6cf7a;padding:8px 14px;font:13px/1.4 system-ui,sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#demo-banner button{font:inherit;padding:3px 10px;border:1px solid #b99a1c;background:#fff;color:#3b2f00;border-radius:6px;cursor:pointer}
#demo-banner a{color:#5a4600}
#out{display:none!important}
@media(max-width:640px){#demo-banner{padding:5px 10px;font-size:12px;gap:8px}#demo-banner .long{display:none}#demo-banner button{padding:2px 8px}
header{padding:4px 14px!important}header nav{flex-wrap:nowrap!important;overflow-x:auto;white-space:nowrap}header nav button{flex:0 0 auto;padding:8px 10px!important}}</style><script src="sql-wasm.js"></script><script src="demo-config.js"></script><script src="runtime.js"></script></head><body>
<button onclick="print()">Print or save as PDF</button><div id="o">Loading...</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const id=+new URLSearchParams(location.search).get('id');const r=await fetch('/api/orders').then(r=>r.json());const o=(r.orders||[]).find(x=>x.id===id);
if(!o){document.getElementById('o').textContent='Order not found';return}
document.getElementById('o').innerHTML=`<div class="top"><div><h1>PACKING SLIP</h1><div class="mut">${esc(o.number)} · ${esc(o.day)}</div></div><span class="st">${esc(o.status)}</span></div><p><b>Customer</b><br>${esc(o.customer)}</p>
<table><thead><tr><th></th><th>SKU</th><th>Item</th><th class="n">Qty</th></tr></thead><tbody>${o.items.map(i=>`<tr><td><span class="box"></span></td><td>${esc(i.sku)}</td><td>${esc(i.name)}</td><td class="n"><b>${i.qty}</b></td></tr>`).join('')}</tbody></table><p class="mut">${o.units} unit(s) in ${o.items.length} line(s). Tick each line as you pack it.</p>`;document.title='Packing slip '+o.number})();
</script></body></html>
